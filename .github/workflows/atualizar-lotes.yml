name: Atualizar lotes
on:
  schedule:
    - cron: "*/5 * * * *"   # a cada 5 minutos
  workflow_dispatch:       # botão "Run workflow" para rodar na hora
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preparar
        run: pip install --quiet pillow
      - name: Baixar lotes do forinvest
        run: python atualizar.py
        env:
          FORINVEST_EMAIL: ${{ secrets.FORINVEST_EMAIL }}
          FORINVEST_SENHA: ${{ secrets.FORINVEST_SENHA }}
      - name: Salvar se mudou
        run: |
          git config user.name "robo-lotes"
          git config user.email "robo-lotes@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Atualiza lotes" && git pull --rebase origin main && git push)
