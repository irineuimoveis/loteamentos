name: Atualizar lotes
on:
  schedule:
    - cron: "*/5 * * * *"   # a cada 5 minutos
  workflow_dispatch:       # botão "Run workflow" para rodar na hora
permissions:
  contents: write
concurrency:              # uma rodada de cada vez (não brigam pelo mesmo arquivo)
  group: atualizar-lotes
  cancel-in-progress: false
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preparar
        run: pip install --quiet pillow
      - name: Baixar lotes do forinvest
        run: python atualizar.py
        env:
          FORINVEST_EMAIL: ${{ secrets.FORINVEST_EMAIL }}
          FORINVEST_SENHA: ${{ secrets.FORINVEST_SENHA }}
      - name: Salvar se mudou
        run: |
          git config user.name "robo-lotes"
          git config user.email "robo-lotes@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nada mudou"; exit 0; fi
          git commit -m "Atualiza lotes"
          # se outra alteração entrou no meio (ex.: painel do corretor), junta e prefere os dados novos do robô
          for tentativa in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          exit 1

